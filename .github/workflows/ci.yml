name: CI

env:
  OSCAIRN_REQUIRE_SOCKET_BIND: "1"

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build liblilv-dev lv2-dev lv2-examples libsndfile1-dev libsamplerate0-dev x42-plugins

      - name: Check out pinned upstream LV2 examples (Linux)
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: lv2/lv2
          ref: 0bcde338db1c63bbc503b4d1f6d7b55ed43154af
          path: upstream-lv2

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja lilv lv2

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOSCAIRN_LV2=ON
          -DOSCAIRN_LV2_EXAMPLE_DIR="${{ runner.os == 'Linux' && '/usr/lib/lv2' || '' }}"
          -DOSCAIRN_LV2_SOURCE_DIR="${{ runner.os == 'Linux' && format('{0}/upstream-lv2', github.workspace) || '' }}"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check out pinned MOD MDA sources
        uses: actions/checkout@v4
        with:
          repository: mod-audio/mda-lv2
          ref: b2df88cb28540856b7ec7d0210809efd7ca6bcd7
          path: upstream-mod-mda

      - name: Check out pinned MOD metadata
        uses: actions/checkout@v4
        with:
          repository: mod-audio/mod-lv2-data
          ref: 4d4fb43010296d1e672cc0759a4d1afdb7f02fe0
          path: upstream-mod-data
          sparse-checkout: |
            plugins-fixed/mod-mda-JX10.lv2
            plugins-fixed/mod-mda-DX10.lv2
            plugins-fixed/mod-mda-EPiano.lv2
            plugins-fixed/mod-mda-Ambience.lv2
            plugins-fixed/mod-mda-DubDelay.lv2
            plugins-fixed/mod-mda-Overdrive.lv2

      - name: Build and test production MOD instruments and effects
        run: |
          python3 core/lv2-host/tests/production/build_mod_mda.py upstream-mod-mda build/production-lv2 --mod-data upstream-mod-data
          python3 core/lv2-host/tests/production/run.py build/core/lv2-host/tests/oscairn-lv2-production-probe build/production-results --mod-root build/production-lv2 --renderer build/hosts/oscairn-render --sequencer build/plugins/oscairn-step-sequencer.clap

      - name: Test production x42 EQ with larger Atom buffers (Linux)
        if: runner.os == 'Linux'
        run: python3 core/lv2-host/tests/production/run.py build/core/lv2-host/tests/oscairn-lv2-production-probe build/x42-production-results --system-root /usr/lib/lv2 --only x42-fil4-stereo

      - name: Upload production test measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-lv2-${{ matrix.os }}
          path: |
            build/production-results/results.json
            build/x42-production-results/results.json
          if-no-files-found: ignore

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build liblilv-dev lv2-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DOSCAIRN_LV2=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -g"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread
          -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=thread
      - name: Build
        run: cmake --build build
      - name: Test
        # The scanner tests deliberately crash and hang plugins in child processes.
        run: ctest --test-dir build --output-on-failure -E "scanner|benchmark-cli"
